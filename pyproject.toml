[project]
name = "vibration-anomaly-detection"
version = "0.1.0"
description = "Bearing fault diagnosis from the CWRU vibration benchmark with leakage-free evaluation."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Bakkar Rana", email = "bakkarranna@example.com"}
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
vibdiag = "vibdiag.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
